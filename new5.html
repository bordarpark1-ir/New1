<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استعلام نوبت</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#087f5b,#12b886);
    color:white;
    padding:28px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:10px 0 0;
    font-size:15px;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search-box button{
    border:0;
    background:#087f5b;
    color:white;
    padding:0 22px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

.result{
    display:none;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px 5px;
    border-bottom:1px solid #eee;
}

.row:last-child{
    border-bottom:0;
}

.label{
    color:#666;
    font-weight:bold;
}

.value{
    color:#111;
    text-align:left;
    word-break:break-word;
}

.message{
    display:none;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    text-align:center;
    background:#fff3cd;
    color:#856404;
}
</style>
</head>

<body>

<div class="header">
    <h1>استعلام نوبت</h1>
    <p>سامانه استعلام وضعیت نوبت خودرو</p>
</div>

<div class="container">

    <div class="card">

        <div class="search-box">
            <input
                type="text"
                id="serial"
                placeholder="شماره سریال نوبت را وارد کنید"
            >

            <button onclick="searchAppointment()">
                استعلام
            </button>
        </div>

        <div id="message" class="message"></div>

        <div id="result" class="result">

            <div class="row">
                <span class="label">شماره سریال</span>
                <span class="value" id="r_serial">-</span>
            </div>

            <div class="row">
                <span class="label">مرز</span>
                <span class="value" id="r_border_name">-</span>
            </div>

            <div class="row">
                <span class="label">نوع صف</span>
                <span class="value" id="r_queue_type">-</span>
            </div>

            <div class="row">
                <span class="label">شماره پلاک</span>
                <span class="value" id="r_plate_number">-</span>
            </div>

            <div class="row">
                <span class="label">نوع نوبت</span>
                <span class="value" id="r_appointment_type">-</span>
            </div>

            <div class="row">
                <span class="label">زمان دریافت نوبت</span>
                <span class="value" id="r_received_at">-</span>
            </div>

            <div class="row">
                <span class="label">وضعیت</span>
                <span class="value" id="r_status">-</span>
            </div>

            <div class="row">
                <span class="label">ترمینال</span>
                <span class="value" id="r_terminal">-</span>
            </div>

            <div class="row">
                <span class="label">شماره خدمت</span>
                <span class="value" id="r_service_number">-</span>
            </div>

            <div class="row">
                <span class="label">ورود به ترمینال</span>
                <span class="value" id="r_entered_terminal_at">-</span>
            </div>

            <div class="row">
                <span class="label">فراخوانی</span>
                <span class="value" id="r_called_at">-</span>
            </div>

            <div class="row">
                <span class="label">خروج از ترمینال</span>
                <span class="value" id="r_exited_terminal_at">-</span>
            </div>

            <div class="row">
                <span class="label">اجازه گمرک</span>
                <span class="value" id="r_allowed_customs_at">-</span>
            </div>

        </div>

    </div>

</div>

<script>

const supabaseClient = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
);


/* نمایش پیام */

function showMessage(text){

    const box = document.getElementById("message");

    box.style.display = "block";
    box.textContent = text;
}


/* پاک کردن پیام */

function hideMessage(){

    document.getElementById("message").style.display = "none";
}


/* نمایش اطلاعات */

function showResult(row){

    document.getElementById("result").style.display = "block";

    document.getElementById("r_serial").textContent =
        row.serial ?? "-";

    document.getElementById("r_border_name").textContent =
        row.border_name ?? "-";

    document.getElementById("r_queue_type").textContent =
        row.queue_type ?? "-";

    document.getElementById("r_plate_number").textContent =
        row.plate_number ?? "-";

    document.getElementById("r_appointment_type").textContent =
        row.appointment_type ?? "-";

    document.getElementById("r_received_at").textContent =
        row.received_at ?? "-";

    document.getElementById("r_status").textContent =
        row.status ?? "-";

    document.getElementById("r_terminal").textContent =
        row.terminal ?? "-";

    document.getElementById("r_service_number").textContent =
        row.service_number ?? "-";

    document.getElementById("r_entered_terminal_at").textContent =
        row.entered_terminal_at ?? "-";

    document.getElementById("r_called_at").textContent =
        row.called_at ?? "-";

    document.getElementById("r_exited_terminal_at").textContent =
        row.exited_terminal_at ?? "-";

    document.getElementById("r_allowed_customs_at").textContent =
        row.allowed_customs_at ?? "-";
}


/* =====================================================
   استعلام نوبت
   ===================================================== */

async function searchAppointment(){

    hideMessage();

    document.getElementById("result").style.display = "none";


    const url = new URL(window.location.href);

    /*
       فقط ID را از QR می‌گیریم.
       serial در URL کاملاً نادیده گرفته می‌شود.
    */

    const qrId = url.searchParams.get("id");


    /*
       اگر QR دارای ID باشد
       فقط بر اساس ID جستجو می‌کنیم.
    */

    if(qrId !== null && qrId.trim() !== ""){

        const numericId = Number(qrId);


        if(!Number.isInteger(numericId)){

            showMessage("شناسه QR معتبر نیست.");

            return;
        }


        const { data, error } =
            await supabaseClient
                .from("appointments")
                .select("*")
                .eq("id", numericId)
                .single();


        if(error){

            console.error("Supabase Error:", error);

            showMessage(
                "خطا در دریافت اطلاعات نوبت: " +
                error.message
            );

            return;
        }


        if(!data){

            showMessage(
                "اطلاعات این نوبت پیدا نشد."
            );

            return;
        }


        /*
           نمایش همان رکوردی که ID آن داخل QR بوده
        */

        showResult(data);

        return;
    }


    /*
       اگر QR فاقد ID بود،
       جستجوی دستی با سریال انجام می‌شود.
    */

    const manualSerial =
        document.getElementById("serial").value.trim();


    if(!manualSerial){

        showMessage(
            "لطفاً شماره سریال نوبت را وارد کنید."
        );

        return;
    }


    const { data, error } =
        await supabaseClient
            .from("appointments")
            .select("*")
            .eq("serial", manualSerial)
            .limit(1)
            .maybeSingle();


    if(error){

        console.error("Supabase Error:", error);

        showMessage(
            "خطا در دریافت اطلاعات نوبت: " +
            error.message
        );

        return;
    }


    if(!data){

        showMessage(
            "نوبتی با این شماره سریال پیدا نشد."
        );

        return;
    }


    showResult(data);
}


/* =====================================================
   اجرای خودکار هنگام باز شدن QR
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const url =
            new URL(window.location.href);

        const qrId =
            url.searchParams.get("id");

        const qrSerial =
            url.searchParams.get("serial");


        /*
           فقط برای نمایش داخل کادر ورودی،
           سریال QR را نشان می‌دهیم.
           در صورت وجود ID، جستجو فقط با ID انجام می‌شود.
        */

        if(qrSerial){

            document.getElementById("serial").value =
                qrSerial;
        }


        /*
           اگر ID وجود داشته باشد،
           استعلام خودکار انجام می‌شود.
        */

        if(qrId){

            searchAppointment();
        }

    }
);

</script>

</body>
</html>

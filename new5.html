<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استعلام نوبت</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>

<style>
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f4f7fb;
color:#222
}
.header{
background:linear-gradient(135deg,#087f5b,#12b886);
color:white;
padding:28px 15px;
text-align:center
}
.header h1{
margin:0;
font-size:28px
}
.header p{
margin:10px 0 0;
font-size:15px
}
.container{
max-width:700px;
margin:30px auto;
padding:0 15px
}
.card{
background:white;
border-radius:18px;
padding:22px;
box-shadow:0 5px 25px rgba(0,0,0,.08)
}
.search{
display:flex;
gap:10px;
margin-bottom:20px
}
input{
flex:1;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px
}
button{
border:0;
background:#087f5b;
color:white;
padding:0 22px;
border-radius:12px;
font-size:16px
}
.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:13px 5px;
border-bottom:1px solid #eee
}
.label{
color:#666;
font-weight:bold
}
.value{
color:#111;
text-align:left;
word-break:break-word
}
#result{
display:none
}
#message{
display:none;
padding:15px;
border-radius:12px;
margin-top:15px;
text-align:center;
background:#fff3cd;
color:#856404
}
</style>
</head>

<body>

<div class="header">
<h1>استعلام نوبت</h1>
<p>سامانه استعلام وضعیت نوبت خودرو</p>
</div>

<div class="container">
<div class="card">

<div class="search">
<input id="serial" placeholder="شماره سریال نوبت را وارد کنید">
<button onclick="manualSearch()">استعلام</button>
</div>

<div id="message"></div>

<div id="result">

<div class="row"><span class="label">شماره سریال</span><span class="value" id="serial_v"></span></div>
<div class="row"><span class="label">مرز</span><span class="value" id="border_v"></span></div>
<div class="row"><span class="label">نوع صف</span><span class="value" id="queue_v"></span></div>
<div class="row"><span class="label">شماره پلاک</span><span class="value" id="plate_v"></span></div>
<div class="row"><span class="label">نوع نوبت</span><span class="value" id="type_v"></span></div>
<div class="row"><span class="label">زمان دریافت نوبت</span><span class="value" id="received_v"></span></div>
<div class="row"><span class="label">وضعیت</span><span class="value" id="status_v"></span></div>
<div class="row"><span class="label">ترمینال</span><span class="value" id="terminal_v"></span></div>
<div class="row"><span class="label">شماره خدمت</span><span class="value" id="service_v"></span></div>
<div class="row"><span class="label">ورود به ترمینال</span><span class="value" id="entered_v"></span></div>
<div class="row"><span class="label">فراخوانی</span><span class="value" id="called_v"></span></div>
<div class="row"><span class="label">خروج از ترمینال</span><span class="value" id="exited_v"></span></div>
<div class="row"><span class="label">اجازه گمرک</span><span class="value" id="customs_v"></span></div>

</div>
</div>
</div>

<script>

const db = window.supabase.createClient(
window.SUPABASE_URL,
window.SUPABASE_ANON_KEY
);

function val(id){
return document.getElementById(id);
}

function show(row){

val("result").style.display="block";

val("serial_v").textContent=row.serial ?? "-";
val("border_v").textContent=row.border_name ?? "-";
val("queue_v").textContent=row.queue_type ?? "-";
val("plate_v").textContent=row.plate_number ?? "-";
val("type_v").textContent=row.appointment_type ?? "-";
val("received_v").textContent=row.received_at ?? "-";
val("status_v").textContent=row.status ?? "-";
val("terminal_v").textContent=row.terminal ?? "-";
val("service_v").textContent=row.service_number ?? "-";
val("entered_v").textContent=row.entered_terminal_at ?? "-";
val("called_v").textContent=row.called_at ?? "-";
val("exited_v").textContent=row.exited_terminal_at ?? "-";
val("customs_v").textContent=row.allowed_customs_at ?? "-";

}

async function getById(){

val("message").style.display="none";
val("result").style.display="none";

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

if(!id){
val("message").textContent="شناسه نوبت وجود ندارد.";
val("message").style.display="block";
return;
}

const {data,error}=await db
.from("appointments")
.select("*")
.eq("id",Number(id))
.maybeSingle();

if(error){
console.error(error);
val("message").textContent="خطا در دریافت اطلاعات.";
val("message").style.display="block";
return;
}

if(!data){
val("message").textContent="نوبتی با این شناسه پیدا نشد.";
val("message").style.display="block";
return;
}

show(data);

}

async function manualSearch(){

const serial=val("serial").value.trim();

if(!serial)return;

const {data,error}=await db
.from("appointments")
.select("*")
.eq("serial",serial)
.maybeSingle();

if(error||!data){
val("message").textContent="نوبت پیدا نشد.";
val("message").style.display="block";
return;
}

show(data);

}

document.addEventListener("DOMContentLoaded",getById);

</script>

</body>
</html>

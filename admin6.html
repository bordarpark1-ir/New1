<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت نوبت‌ها</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#f4f6f8;
  color:#111;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:14px;
  padding:25px;
  box-shadow:0 8px 30px #0001;
}

.loginBox h2{
  margin-top:0;
}

.top{
  background:#111827;
  color:#fff;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.wrap{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 18px #0000000d;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.f{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.f.s2{
  grid-column:span 2;
}

.f.s4{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:700;
}

input,select,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:10px;
  font-size:13px;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
  line-height:1.8;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:#111827;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  font-size:13px;
}

.main{
  background:#111827;
  color:#fff;
}

.green{
  background:#16803c;
  color:#fff;
}

.red{
  background:#c62828;
  color:#fff;
}

.light{
  background:#e5e7eb;
  color:#111;
}

.msg{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  font-size:13px;
}

.msg.show{
  display:block;
}

.msg.ok{
  background:#dcfce7;
  color:#166534;
}

.msg.err{
  background:#fee2e2;
  color:#991b1b;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.toolbar h2{
  margin:0 0 4px;
}

.search{
  max-width:330px;
}

.tw{
  overflow:auto;
  margin-top:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:right;
  font-size:12px;
}

th{
  background:#f8fafc;
}

.templateBadge{
  display:inline-block;
  padding:4px 7px;
  border-radius:6px;
  background:#eef2ff;
}

.hint{
  font-size:11px;
  color:#555;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
  overflow:auto;
}

.modal.show{
  display:flex;
}

.panel{
  width:100%;
  max-width:650px;
  background:#fff;
  border-radius:12px;
  padding:15px;
  max-height:95vh;
  overflow:auto;
}

.receipt{
  width:100%;
  max-width:430px;
  margin:0 auto;
  background:#fff;
  color:#111;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:12px;
  line-height:1.8;
}

.hidden{
  display:none!important;
}

/* بادپا */

.receipt-badpa{
  border:1px solid #111;
  padding:12px;
}

.badpa-head{
  text-align:center;
  font-size:17px;
  font-weight:700;
}

.badpa-sub{
  text-align:center;
  font-weight:700;
  margin-bottom:10px;
}

.badpa-info{
  border-top:1px solid #111;
  border-bottom:1px solid #111;
}

.badpa-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-bottom:1px solid #ddd;
}

.badpa-row:last-child{
  border-bottom:0;
}

.badpa-cell{
  padding:5px;
  min-height:29px;
}

.badpa-money{
  margin-top:8px;
}

.badpa-money-row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px dotted #777;
}

.badpa-cargo{
  text-align:center;
  font-weight:700;
  margin:10px 0;
}

.badpa-note{
  white-space:pre-line;
  text-align:center;
  font-size:11px;
}

.badpa-qr{
  display:flex;
  justify-content:center;
  margin:10px 0;
}

.badpa-code{
  text-align:center;
  direction:ltr;
  font-weight:700;
  letter-spacing:1px;
}

/* سنوار */

.receipt-senvar{
  border:1px solid #111;
  padding:10px;
}

.senvar-top{
  text-align:center;
  font-weight:700;
  font-size:16px;
}

.senvar-plate{
  text-align:center;
  margin:5px 0;
  font-weight:700;
}

.senvar-meta{
  border-top:1px solid #111;
  border-bottom:1px solid #111;
}

.senvar-meta-row{
  display:flex;
  justify-content:space-between;
  padding:5px;
  border-bottom:1px solid #ddd;
}

.senvar-meta-row:last-child{
  border-bottom:0;
}

.senvar-appointment{
  text-align:center;
  font-weight:700;
  margin:8px 0;
}

.senvar-main{
  border-top:1px solid #111;
  border-bottom:1px solid #111;
}

.senvar-title{
  text-align:center;
  font-weight:700;
  padding:7px;
}

.senvar-row{
  display:flex;
  justify-content:space-between;
  padding:4px 5px;
  border-bottom:1px dotted #777;
}

.senvar-trip{
  text-align:center;
  margin-top:8px;
  font-size:11px;
}

.senvar-qr{
  display:flex;
  justify-content:center;
  margin:10px 0;
}

.senvar-code{
  text-align:center;
  direction:ltr;
  font-weight:700;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .f.s2{
    grid-column:auto;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:14px;
  }

  .top{
    padding:12px;
  }
}

@media print{
  body{
    background:#fff;
  }

  body *{
    visibility:hidden;
  }

  #modal,
  #modal *{
    visibility:visible;
  }

  #modal{
    position:absolute;
    inset:0;
    display:flex!important;
    background:#fff;
    padding:0;
  }

  #modal .panel{
    box-shadow:none;
    max-width:none;
    max-height:none;
    overflow:visible;
  }

  #modal .mb{
    display:none!important;
  }
}
</style>
</head>

<body>

<div id="loginPage" class="login">
  <div class="loginBox">

    <h2>پنل مدیریت</h2>
    <p>ورود مدیر سامانه</p>

    <div class="f">
      <label>ایمیل</label>
      <input id="email" type="email">
    </div>

    <div class="f" style="margin-top:10px">
      <label>رمز عبور</label>
      <input id="password" type="password">
    </div>

    <div class="actions">
      <button id="loginBtn" class="main" onclick="login()">
        ورود
      </button>
    </div>

    <div id="loginMsg" class="msg"></div>

  </div>
</div>

<div id="adminPage" style="display:none">

  <div class="top">
    <b>مدیریت نوبت‌ها</b>

    <div>
      <button class="light" onclick="goHome()">
        ⌂ خانه
      </button>

      <button class="light" onclick="logout()">
        خروج
      </button>
    </div>
  </div>

  <main class="wrap">

    <div class="card">

      <h2 id="formTitle">
        ثبت نوبت جدید
      </h2>

      <p>
        اطلاعات نوبت و رسید از اینجا قابل ویرایش است.
      </p>

      <input type="hidden" id="editId">

      <div class="grid">

        <div class="f">
          <label>شماره نوبت / سریال</label>
          <input id="serial">
        </div>

        <div class="f">
          <label>توکن اختصاصی QR</label>
          <input
            id="public_token"
            readonly
            placeholder="بعد از ذخیره ساخته می‌شود">
        </div>

        <div class="f">
          <label>نام مرز</label>
          <input id="border_name">
        </div>

        <div class="f">
          <label>نوع صف</label>
          <input id="queue_type">
        </div>

        <div class="f">
          <label>پلاک</label>
          <input id="plate_number">
        </div>

        <div class="f">
          <label>نوع نوبت</label>
          <input id="appointment_type">
        </div>

        <div class="f">
          <label>زمان دریافت</label>
          <input id="received_at" type="datetime-local">
        </div>

        <div class="f">
          <label>وضعیت</label>
          <input id="status">
        </div>

        <div class="f">
          <label>ترمینال</label>
          <input id="terminal">
        </div>

        <div class="f">
          <label>شماره خدمت</label>
          <input id="service_number">
        </div>

        <div class="f">
          <label>ورود به ترمینال</label>
          <input id="entered_terminal_at" type="datetime-local">
        </div>

        <div class="f">
          <label>فراخوان</label>
          <input id="called_at" type="datetime-local">
        </div>

        <div class="f">
          <label>خروج از ترمینال</label>
          <input id="exited_terminal_at" type="datetime-local">
        </div>

        <div class="f">
          <label>مجاز گمرک</label>
          <input id="allowed_customs_at" type="datetime-local">
        </div>

        <div class="f">
          <label>اسم پارکینگ / مجموعه</label>
          <input
            id="parking_name"
            placeholder="بادپا – ریمدان یا سنوار حیات – ریمدان"
            oninput="showTemplateHint()">
        </div>

        <div class="f">
          <label>قالب رسید</label>

          <select id="receipt_template"
                  onchange="showTemplateHint()">

            <option value="auto">
              تشخیص خودکار از اسم پارکینگ
            </option>

            <option value="badpa">
              بادپا – ریمدان
            </option>

            <option value="senvar">
              سنوار حیات – ریمدان
            </option>

          </select>

          <div id="templateHint" class="hint"></div>
        </div>

        <div class="f">
          <label>ترانزیت (فقط بادپا)</label>
          <input id="receipt_transit">
        </div>

        <div class="f">
          <label>نوع ناوگان</label>
          <input id="receipt_vehicle_type">
        </div>

        <div class="f">
          <label>وضعیت بار</label>
          <input id="receipt_load_status">
        </div>

        <div class="f">
          <label>ورود روی رسید</label>
          <input id="receipt_entry_time">
        </div>

        <div class="f">
          <label>فراخوان روی رسید</label>
          <input id="receipt_call_time">
        </div>

        <div class="f">
          <label>خروج روی رسید</label>
          <input id="receipt_exit_time">
        </div>

        <div class="f">
          <label>مدت پارک (بادپا)</label>
          <input id="parking_duration">
        </div>

        <div class="f">
          <label>خدمات پارکینگ</label>
          <input id="parking_service">
        </div>

        <div class="f">
          <label>خدمات شهرداری</label>
          <input id="municipality_service" value="0">
        </div>

        <div class="f">
          <label>مالیات ارزش افزوده</label>
          <input id="vat">
        </div>

        <div class="f">
          <label>جمع پرداختی</label>
          <input id="total_payment">
        </div>

        <div class="f">
          <label>شناسه سفر (فقط سنوار)</label>
          <input id="trip_id">
        </div>

        <div class="f">
          <label>عنوان بار</label>
          <input id="cargo_title">
        </div>

        <div class="f s2">
          <label>کد پایین رسید</label>
          <input id="receipt_code">
        </div>

        <div class="f s4">
          <label>متن توضیحات رسید (بادپا)</label>

          <textarea id="receipt_note">راننده گرامی توجه داشته باشید
انقضا قبض شما: [زمان انقضا]
درصورت مراجعه بعد از زمان مذکور از پذیرش شما با این قبض معذور میباشیم</textarea>
        </div>

        <div class="f">
          <label>زمان پایین رسید سنوار</label>
          <input
            id="senvar_footer_time"
            placeholder="ب.ظ 09:40:14 1405/05/26">
        </div>

      </div>

      <div class="actions">

        <button
          id="saveBtn"
          class="main"
          onclick="saveAppointment()">
          ذخیره نوبت
        </button>

        <button
          class="light"
          onclick="resetForm()">
          پاک کردن
        </button>

        <button
          class="green"
          onclick="preview()">
          پیش‌نمایش رسید
        </button>

      </div>

      <div id="formMsg" class="msg"></div>

    </div>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>پنل مدیریت نوبت‌ها</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f3f5f7;
font-family:Tahoma,Arial,sans-serif;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h1{
margin-top:0;
}

h2{
font-size:18px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font-family:inherit;
font-size:14px;
}

textarea{
min-height:90px;
resize:vertical;
}

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.full{
grid-column:1/-1;
}

button{
border:0;
padding:12px 18px;
border-radius:9px;
cursor:pointer;
color:white;
background:#1976d2;
font-family:inherit;
}

.green{
background:#198754;
}

.red{
background:#dc3545;
}

.gray{
background:#6c757d;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,
td{
padding:10px;
border-bottom:1px solid #eee;
text-align:right;
font-size:13px;
}

th{
background:#f5f5f5;
}

.login{
max-width:400px;
margin:80px auto;
}

.hidden{
display:none;
}

.qr-box{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.qr-card{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
}

#qr{
display:flex;
justify-content:center;
margin:20px;
}

@media(max-width:700px){

.form{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="loginPage" class="login card">

<h1>
ورود مدیر
</h1>


<input
id="email"
type="email"
placeholder="ایمیل مدیر"
>


<br><br>


<input
id="password"
type="password"
placeholder="رمز عبور"
>


<div class="actions">

<button onclick="login()">
ورود
</button>

</div>


<div id="loginError"></div>

</div>


<!-- ADMIN -->

<div id="adminPage"
class="container hidden">


<div class="card">

<h1>
پنل مدیریت نوبت‌ها
</h1>


<div class="actions">

<button
class="gray"
onclick="logout()"
>
خروج
</button>

</div>

</div>


<!-- FORM -->

<div class="card">

<h2 id="formTitle">
افزودن نوبت جدید
</h2>


<div class="form">


<input
id="code"
placeholder="کد نوبت"
>


<input
id="turn_number"
placeholder="شماره نوبت"
>


<input
id="driver_name"
placeholder="نام راننده"
>


<input
id="vehicle_plate"
placeholder="پلاک خودرو"
>


<input
id="vehicle_type"
placeholder="نوع خودرو"
>


<input
id="origin"
placeholder="مبدأ"
>


<input
id="destination"
placeholder="مقصد"
>


<input
id="turn_date"
type="date"
>


<input
id="turn_time"
type="time"
>


<select id="status">

<option>
در انتظار
</option>

<option>
تأیید شده
</option>

<option>
لغو شده
</option>

<option>
انجام شده
</option>

</select>


<textarea
id="description"
class="full"
placeholder="توضیحات"
></textarea>


</div>


<div class="actions">

<button
onclick="saveTurn()"
>
ذخیره نوبت
</button>


<button
class="gray"
onclick="resetForm()"
>
پاک کردن فرم
</button>

</div>


<div id="message"></div>

</div>


<!-- SEARCH -->

<div class="card">

<h2>
نوبت‌ها
</h2>


<input
id="search"
placeholder="جستجوی کد، نام یا پلاک..."
oninput="loadTurns()"
>


<div id="table"></div>

</div>


</div>


<!-- QR MODAL -->

<div
id="qrModal"
class="qr-box"
>

<div class="qr-card">

<h2>
QR Code نوبت
</h2>


<div id="qr"></div>


<div id="qrLink"></div>


<div class="actions">

<button
class="green"
onclick="downloadQR()"
>
دانلود QR
</button>


<button
class="gray"
onclick="closeQR()"
>
بستن
</button>

</div>

</div>

</div>


<script>


/* ======================
   SUPABASE
====================== */

const SUPABASE_URL =
"https://YOUR-PROJECT.supabase.co";

const SUPABASE_KEY =
"YOUR_ANON_KEY";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let editingId=null;

let currentQRCode="";


/* ======================
   LOGIN
====================== */

async function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


const {error} =
await db.auth.signInWithPassword({
email,
password
});


if(error){

document.getElementById(
"loginError"
).innerText =
"ایمیل یا رمز عبور اشتباه است.";

return;

}


showAdmin();

}


/* ======================
   LOGOUT
====================== */

async function logout(){

await db.auth.signOut();

location.reload();

}


/* ======================
   SESSION
====================== */

async function checkSession(){

const {data} =
await db.auth.getSession();

if(data.session){

showAdmin();

}

}


function showAdmin(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("adminPage")
.classList.remove("hidden");

loadTurns();

}


/* ======================
   SAVE
====================== */

async function saveTurn(){

const data={

code:get("code"),

turn_number:get("turn_number"),

driver_name:get("driver_name"),

vehicle_plate:get("vehicle_plate"),

vehicle_type:get("vehicle_type"),

origin:get("origin"),

destination:get("destination"),

turn_date:get("turn_date") || null,

turn_time:get("turn_time") || null,

status:get("status"),

description:get("description")

};


if(!data.code){

alert("کد نوبت را وارد کنید.");

return;

}


let result;


if(editingId){

result =
await db
.from("turns")
.update(data)
.eq("id",editingId);

}
else{

result =
await db
.from("turns")
.insert(data);

}


if(result.error){

alert(result.error.message);

return;

}


alert(
editingId ?
"نوبت ویرایش شد." :
"نوبت ثبت شد."
);


resetForm();

loadTurns();

}


/* ======================
   GET VALUE
====================== */

function get(id){

return document
.getElementById(id)
.value
.trim();

}


/* ======================
   LOAD
====================== */

async function loadTurns(){

let query =
db
.from("turns")
.select("*")
.order("created_at",{ascending:false});


const search =
document
.getElementById("search")
.value
.trim();


if(search){

query =
query.or(
`code.ilike.%${search}%,driver_name.ilike.%${search}%,vehicle_plate.ilike.%${search}%`
);

}


const {data,error} =
await query;


if(error){

document.getElementById("table").innerHTML =
error.message;

return;

}


let html=`

<table>

<tr>

<th>کد</th>

<th>شماره</th>

<th>راننده</th>

<th>پلاک</th>

<th>تاریخ</th>

<th>وضعیت</th>

<th>عملیات</th>

</tr>

`;


data.forEach(row=>{

html+=`

<tr>

<td>${row.code || "-"}</td>

<td>${row.turn_number || "-"}</td>

<td>${row.driver_name || "-"}</td>

<td>${row.vehicle_plate || "-"}</td>

<td>${row.turn_date || "-"}</td>

<td>${row.status || "-"}</td>

<td>

<button
onclick='editTurn(${JSON.stringify(row)})'
>
ویرایش
</button>

<button
class="green"
onclick='showQR(${JSON.stringify(row)})'
>
QR
</button>

<button
class="red"
onclick="deleteTurn(${row.id})"
>
حذف
</button>

</td>

</tr>

`;

});


html+="</table>";


document.getElementById("table").innerHTML =
html;

}


/* ======================
   EDIT
====================== */

function editTurn(row){

editingId=row.id;

set("code",row.code);

set("turn_number",row.turn_number);

set("driver_name",row.driver_name);

set("vehicle_plate",row.vehicle_plate);

set("vehicle_type",row.vehicle_type);

set("origin",row.origin);

set("destination",row.destination);

set("turn_date",row.turn_date);

set("turn_time",
row.turn_time ?
row.turn_time.substring(0,5) :
""
);

set("status",row.status);

set("description",row.description);


document.getElementById(
"formTitle"
).innerText =
"ویرایش نوبت";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function set(id,value){

document
.getElementById(id)
.value =
value || "";

}


/* ======================
   DELETE
====================== */

async function deleteTurn(id){

if(!confirm(
"آیا از حذف این نوبت مطمئن هستید؟"
)) return;


const {error} =
await db
.from("turns")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadTurns();

}


/* ======================
   RESET
====================== */

function resetForm(){

editingId=null;

[
"code",
"turn_number",
"driver_name",
"vehicle_plate",
"vehicle_type",
"origin",
"destination",
"turn_date",
"turn_time",
"description"
].forEach(id=>set(id,""));


set("status","در انتظار");


document.getElementById(
"formTitle"
).innerText =
"افزودن نوبت جدید";

}


/* ======================
   QR
====================== */

function showQR(row){

const url =
location.origin +
"/turn-inquiry/" +
encodeURIComponent(row.code) +
"/Fa";


currentQRCode=url;


document.getElementById("qr").innerHTML="";


new QRCode(
document.getElementById("qr"),
{
text:url,
width:260,
height:260,
correctLevel:QRCode.CorrectLevel.H
}
);


document.getElementById(
"qrLink"
).innerText=url;


document.getElementById(
"qrModal"
).style.display="flex";

}


function closeQR(){

document.getElementById(
"qrModal"
).style.display="none";

}


function downloadQR(){

const qr =
document.getElementById("qr");

const canvas =
qr.querySelector("canvas");

if(!canvas){

alert("QR آماده نیست.");

return;

}


const code =
get("code");


const a =
document.createElement("a");

a.href =
canvas.toDataURL("image/png");

a.download =
"QR-"+code+".png";

a.click();

}


/* ======================
   START
====================== */

checkSession();

</script>

</body>

</html>

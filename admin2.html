<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت نوبت‌ها</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f7;
  color:#222;
  font-family:Tahoma,Arial,sans-serif;
}

.container{
  width:94%;
  max-width:1200px;
  margin:20px auto;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.login{
  max-width:430px;
  margin:60px auto;
}

h1,h2{
  margin-top:0;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  font-family:inherit;
  margin:5px 0 10px;
  background:#fff;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-family:inherit;
  font-size:14px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:#1683d8;
  color:white;
}

.success{
  background:#159447;
  color:white;
}

.danger{
  background:#d9363e;
  color:white;
}

.secondary{
  background:#eef1f4;
  color:#333;
}

.qr-btn{
  background:#673ab7;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:12px;
}

.ok{
  background:#e7f7ed;
  color:#146c35;
}

.err{
  background:#ffe8e8;
  color:#a40018;
}

.info{
  background:#e8f2ff;
  color:#14558a;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:right;
  white-space:nowrap;
}

th{
  background:#f7f8fa;
}

.table-wrap{
  overflow:auto;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  background:#e9f2ff;
  color:#1467a5;
}

.hidden{
  display:none!important;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.search{
  max-width:400px;
}

.qr-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.qr-box{
  background:#fff;
  width:100%;
  max-width:420px;
  border-radius:18px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

#qrcode{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:20px auto;
  min-height:256px;
}

#qrcode img,
#qrcode canvas{
  margin:auto;
}

.qr-serial{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

.qr-url{
  direction:ltr;
  word-break:break-all;
  font-size:12px;
  color:#555;
  background:#f5f5f5;
  padding:8px;
  border-radius:8px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .container{
    width:96%;
    margin:12px auto;
  }

  .login{
    margin:30px auto;
  }

  .qr-box{
    padding:18px;
  }
}

@media print{
  body *{
    visibility:hidden;
  }

  .qr-box,
  .qr-box *{
    visibility:visible;
  }

  .qr-overlay{
    position:absolute;
    background:#fff;
  }

  .qr-box{
    box-shadow:none;
    max-width:100%;
  }

  .no-print{
    display:none!important;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="card login">

  <h1>🔐 ورود مدیریت</h1>

  <p>
    برای ورود به پنل مدیریت نوبت‌ها وارد شوید.
  </p>

  <div id="loginMsg" class="message err"></div>

  <label>ایمیل مدیر</label>
  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="ایمیل مدیر"
  >

  <label>رمز عبور</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="رمز عبور"
  >

  <button
    class="primary"
    style="width:100%"
    onclick="login()"
  >
    ورود به پنل
  </button>

  <div
    id="connectionStatus"
    class="message info"
    style="display:block;margin-top:15px"
  >
    در حال بررسی اتصال...
  </div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="container hidden">

  <div class="card">

    <div class="top">

      <div>
        <h1>📋 پنل مدیریت نوبت‌ها</h1>
        <div id="adminStatus" class="message ok" style="display:block">
          وارد پنل مدیریت شده‌اید.
        </div>
      </div>

      <button
        class="danger"
        onclick="logout()"
      >
        خروج
      </button>

    </div>

  </div>


  <!-- FORM -->
  <div class="card">

    <h2>➕ ثبت / ویرایش نوبت</h2>

    <div id="formMsg" class="message"></div>

    <div class="grid">

      <div>
        <label>شماره سریال</label>
        <input id="serial" placeholder="شماره سریال">
      </div>

      <div>
        <label>نام مرز</label>
        <input id="border_name" placeholder="نام مرز">
      </div>

      <div>
        <label>نوع صف</label>
        <input id="queue_type" placeholder="نوع صف">
      </div>

      <div>
        <label>شماره پلاک</label>
        <input id="plate_number" placeholder="شماره پلاک">
      </div>

      <div>
        <label>نوع نوبت</label>
        <input id="appointment_type" placeholder="نوع نوبت">
      </div>

      <div>
        <label>تاریخ دریافت</label>
        <input id="received_at" type="datetime-local">
      </div>

      <div>
        <label>وضعیت</label>
        <input id="status" placeholder="وضعیت">
      </div>

      <div>
        <label>ترمینال</label>
        <input id="terminal" placeholder="ترمینال">
      </div>

      <div>
        <label>شماره خدمت</label>
        <input id="service_number" placeholder="شماره خدمت">
      </div>

      <div>
        <label>ورود به ترمینال</label>
        <input id="entered_terminal_at" type="datetime-local">
      </div>

      <div>
        <label>زمان فراخوانی</label>
        <input id="called_at" type="datetime-local">
      </div>

      <div>
        <label>خروج از ترمینال</label>
        <input id="exited_terminal_at" type="datetime-local">
      </div>

      <div>
        <label>مجاز شدن گمرک</label>
        <input id="allowed_customs_at" type="datetime-local">
      </div>

    </div>

    <div class="actions">

      <button
        class="success"
        onclick="saveAppointment()"
      >
        💾 ذخیره نوبت
      </button>

      <button
        class="secondary"
        onclick="resetForm()"
      >
        🔄 پاک کردن فرم
      </button>

    </div>

  </div>


  <!-- LIST -->
  <div class="card">

    <div class="top">

      <h2>📑 فهرست نوبت‌ها</h2>

      <input
        id="search"
        class="search"
        placeholder="🔍 جستجو بر اساس سریال یا پلاک..."
        oninput="filterRows()"
      >

    </div>

    <div id="listMsg" class="message"></div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>سریال</th>
            <th>مرز</th>
            <th>صف</th>
            <th>پلاک</th>
            <th>نوع نوبت</th>
            <th>وضعیت</th>
            <th>ترمینال</th>
            <th>خدمت</th>
            <th>QR</th>
            <th>عملیات</th>
          </tr>
        </thead>

        <tbody id="rows">
        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- QR MODAL -->
<div
  id="qrOverlay"
  class="qr-overlay hidden"
  onclick="closeQR(event)"
>

  <div class="qr-box">

    <h2>📱 QR نوبت</h2>

    <div class="qr-serial" id="qrSerial"></div>

    <div id="qrcode"></div>

    <div
      class="qr-url"
      id="qrUrl"
    ></div>

    <br>

    <div class="actions" style="justify-content:center">

      <button
        class="primary no-print"
        onclick="printQR()"
      >
        🖨️ چاپ QR
      </button>

      <button
        class="success no-print"
        onclick="downloadQR()"
      >
        💾 ذخیره QR
      </button>

      <button
        class="secondary no-print"
        onclick="closeQR()"
      >
        بستن
      </button>

    </div>

  </div>

</div>


<script>

let supabaseClient = null;
let rows = [];
let currentQRSerial = null;


/* =========================
   ELEMENT
========================= */

function el(id){
  return document.getElementById(id);
}


/* =========================
   MESSAGE
========================= */

function showMessage(id,text,type="ok"){

  const box = el(id);

  if(!box) return;

  box.className = "message " + type;
  box.textContent = text;
  box.style.display = "block";

}


/* =========================
   CONFIG
========================= */

function checkConfig(){

  if(
    !window.SUPABASE_URL ||
    !window.SUPABASE_ANON_KEY
  ){

    el("connectionStatus").textContent =
      "خطا: اطلاعات اتصال Supabase در config.js پیدا نشد.";

    el("connectionStatus").className =
      "message err";

    return false;
  }

  return true;
}


/* =========================
   INIT
========================= */

async function init(){

  if(!checkConfig()) return;

  try{

    supabaseClient =
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

    el("connectionStatus").textContent =
      "اتصال اولیه به Supabase آماده است.";

    el("connectionStatus").className =
      "message ok";

    const {
      data:{
        session
      }
    } = await supabaseClient.auth.getSession();

    if(session){

      showAdminPanel();

    }

  }catch(error){

    el("connectionStatus").textContent =
      "خطا در اتصال: " + error.message;

    el("connectionStatus").className =
      "message err";

  }

}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    el("email").value.trim();

  const password =
    el("password").value;

  if(!email || !password){

    showMessage(
      "loginMsg",
      "ایمیل و رمز عبور را وارد کنید.",
      "err"
    );

    return;
  }

  try{

    showMessage(
      "loginMsg",
      "در حال ورود...",
      "info"
    );

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if(error) throw error;

    if(!data.session){

      throw new Error(
        "ورود انجام نشد."
      );

    }

    el("loginMsg").style.display =
      "none";

    showAdminPanel();

  }catch(error){

    showMessage(
      "loginMsg",
      "خطا در ورود: " + error.message,
      "err"
    );

  }

}


/* =========================
   SHOW ADMIN
========================= */

async function showAdminPanel(){

  el("loginBox")
    .classList
    .add("hidden");

  el("adminPanel")
    .classList
    .remove("hidden");

  await loadAppointments();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  if(supabaseClient){

    await supabaseClient.auth.signOut();

  }

  location.reload();

}


/* =========================
   FORM DATA
========================= */

function getFormData(){

  function value(id){

    const v = el(id).value.trim();

    return v === "" ? null : v;

  }

  return {

    serial: value("serial"),

    border_name: value("border_name"),

    queue_type: value("queue_type"),

    plate_number: value("plate_number"),

    appointment_type: value("appointment_type"),

    received_at: value("received_at"),

    status: value("status"),

    terminal: value("terminal"),

    service_number: value("service_number"),

    entered_terminal_at:
      value("entered_terminal_at"),

    called_at:
      value("called_at"),

    exited_terminal_at:
      value("exited_terminal_at"),

    allowed_customs_at:
      value("allowed_customs_at")

  };

}


/* =========================
   RESET FORM
========================= */

function resetForm(){

  [
    "serial",
    "border_name",
    "queue_type",
    "plate_number",
    "appointment_type",
    "received_at",
    "status",
    "terminal",
    "service_number",
    "entered_terminal_at",
    "called_at",
    "exited_terminal_at",
    "allowed_customs_at"
  ].forEach(id => {

    el(id).value = "";

  });

  el("serial").disabled = false;

  showMessage(
    "formMsg",
    "فرم پاک شد.",
    "info"
  );

}


/* =========================
   EDIT
========================= */

function editAppointment(row){

  el("serial").value =
    row.serial ?? "";

  el("border_name").value =
    row.border_name ?? "";

  el("queue_type").value =
    row.queue_type ?? "";

  el("plate_number").value =
    row.plate_number ?? "";

  el("appointment_type").value =
    row.appointment_type ?? "";

  el("received_at").value =
    toDateTimeLocal(row.received_at);

  el("status").value =
    row.status ?? "";

  el("terminal").value =
    row.terminal ?? "";

  el("service_number").value =
    row.service_number ?? "";

  el("entered_terminal_at").value =
    toDateTimeLocal(row.entered_terminal_at);

  el("called_at").value =
    toDateTimeLocal(row.called_at);

  el("exited_terminal_at").value =
    toDateTimeLocal(row.exited_terminal_at);

  el("allowed_customs_at").value =
    toDateTimeLocal(row.allowed_customs_at);

  el("serial").disabled = true;

  showMessage(
    "formMsg",
    "نوبت برای ویرایش انتخاب شد.",
    "info"
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DATE
========================= */

function toDateTimeLocal(value){

  if(!value) return "";

  try{

    const d = new Date(value);

    if(isNaN(d.getTime())) return "";

    const pad = n =>
      String(n).padStart(2,"0");

    return (
      d.getFullYear() +
      "-" +
      pad(d.getMonth()+1) +
      "-" +
      pad(d.getDate()) +
      "T" +
      pad(d.getHours()) +
      ":" +
      pad(d.getMinutes())
    );

  }catch(e){

    return "";

  }

}


/* =========================
   SAVE
========================= */

async function saveAppointment(){

  const data =
    getFormData();

  if(!data.serial){

    showMessage(
      "formMsg",
      "شماره سریال را وارد کنید.",
      "err"
    );

    return;
  }

  try{

    let result;

    const serial =
      data.serial;

    if(el("serial").disabled){

      delete data.serial;

      result =
        await supabaseClient
          .from("appointments")
          .update(data)
          .eq("serial",serial);

    }else{

      result =
        await supabaseClient
          .from("appointments")
          .insert([data]);

    }

    if(result.error)
      throw result.error;

    showMessage(
      "formMsg",
      "نوبت با موفقیت ذخیره شد.",
      "ok"
    );

    resetForm();

    await loadAppointments();

  }catch(error){

    showMessage(
      "formMsg",
      "خطا در ذخیره نوبت: " +
      error.message,
      "err"
    );

  }

}


/* =========================
   LOAD
========================= */

async function loadAppointments(){

  try{

    showMessage(
      "listMsg",
      "در حال دریافت نوبت‌ها...",
      "info"
    );

    const {
      data,
      error
    } =
      await supabaseClient
        .from("appointments")
        .select("*")
        .order("serial",{ascending:true});

    if(error) throw error;

    rows =
      data || [];

    renderRows(rows);

    el("listMsg").style.display =
      "none";

  }catch(error){

    showMessage(
      "listMsg",
      "خطا در دریافت نوبت‌ها: " +
      error.message,
      "err"
    );

  }

}


/* =========================
   RENDER
========================= */

function renderRows(data){

  const tbody =
    el("rows");

  tbody.innerHTML = "";

  if(!data.length){

    tbody.innerHTML =
      '<tr><td colspan="10" style="text-align:center;padding:25px">نوبتی پیدا نشد.</td></tr>';

    return;

  }

  data.forEach(row => {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        <strong>${escapeHtml(row.serial)}</strong>
      </td>

      <td>
        ${escapeHtml(row.border_name)}
      </td>

      <td>
        ${escapeHtml(row.queue_type)}
      </td>

      <td>
        ${escapeHtml(row.plate_number)}
      </td>

      <td>
        ${escapeHtml(row.appointment_type)}
      </td>

      <td>
        <span class="badge">
          ${escapeHtml(row.status)}
        </span>
      </td>

      <td>
        ${escapeHtml(row.terminal)}
      </td>

      <td>
        ${escapeHtml(row.service_number)}
      </td>

      <td>

        <button
          class="qr-btn"
          onclick='showQR(${JSON.stringify(String(row.serial ?? ""))})'
        >
          📱 QR
        </button>

      </td>

      <td>

        <div class="actions">

          <button
            class="primary"
            onclick='editAppointment(${JSON.stringify(row)})'
          >
            ✏️ ویرایش
          </button>

          <button
            class="danger"
            onclick='deleteAppointment(${JSON.stringify(String(row.serial ?? ""))})'
          >
            🗑️ حذف
          </button>

        </div>

      </td>

    `;

    tbody.appendChild(tr);

  });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  if(value === null ||
     value === undefined)
    return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   DELETE
========================= */

async function deleteAppointment(serial){

  if(!confirm(
    "آیا از حذف نوبت با سریال " +
    serial +
    " مطمئن هستید؟"
  )){
    return;
  }

  try{

    const {
      error
    } =
      await supabaseClient
        .from("appointments")
        .delete()
        .eq("serial",serial);

    if(error) throw error;

    alert(
      "نوبت با موفقیت حذف شد."
    );

    await loadAppointments();

  }catch(error){

    alert(
      "خطا در حذف نوبت: " +
      error.message
    );

  }

}


/* =========================
   SEARCH
========================= */

function filterRows(){

  const q =
    el("search")
      .value
      .trim()
      .toLowerCase();

  if(!q){

    renderRows(rows);

    return;

  }

  const filtered =
    rows.filter(row => {

      return [

        row.serial,
        row.plate_number,
        row.border_name,
        row.queue_type,
        row.status

      ].some(value =>

        String(value ?? "")
          .toLowerCase()
          .includes(q)

      );

    });

  renderRows(filtered);

}


/* =========================
   QR CODE
========================= */

function showQR(serial){

  if(!serial){

    alert(
      "شماره سریال این نوبت وجود ندارد."
    );

    return;

  }

  currentQRSerial =
    String(serial);

  /*
    آدرس صفحه اصلی استعلام
    به همراه سریال نوبت
  */

  const baseUrl =
    window.location.origin +
    "/New1/";

  const qrUrl =
    baseUrl +
    "?serial=" +
    encodeURIComponent(
      currentQRSerial
    );

  el("qrSerial").textContent =
    "سریال نوبت: " +
    currentQRSerial;

  el("qrUrl").textContent =
    qrUrl;

  const qr =
    el("qrcode");

  qr.innerHTML = "";

  new QRCode(qr,{

    text:qrUrl,

    width:256,

    height:256,

    correctLevel:
      QRCode.CorrectLevel.H

  });

  el("qrOverlay")
    .classList
    .remove("hidden");

}


/* =========================
   CLOSE QR
========================= */

function closeQR(event){

  if(
    event &&
    event.target !== el("qrOverlay")
  ){
    return;
  }

  el("qrOverlay")
    .classList
    .add("hidden");

}


/* =========================
   PRINT QR
========================= */

function printQR(){

  window.print();

}


/* =========================
   DOWNLOAD QR
========================= */

function downloadQR(){

  const qr =
    el("qrcode");

  const canvas =
    qr.querySelector("canvas");

  const img =
    qr.querySelector("img");

  let url = null;

  if(canvas){

    url =
      canvas.toDataURL(
        "image/png"
      );

  }else if(img){

    url =
      i

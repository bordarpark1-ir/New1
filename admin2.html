<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>پنل مدیریت نوبت‌ها</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase Config -->
<script src="./config.js"></script>

<!-- QR Code -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f7;
  color:#222;
  font-family:Tahoma,Arial,sans-serif;
}

.container{
  width:94%;
  max-width:1200px;
  margin:20px auto;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.login{
  max-width:430px;
  margin:60px auto;
}

h1,h2{
  margin-top:0;
}

label{
  display:block;
  margin-top:8px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  font-family:inherit;
  margin:5px 0 10px;
  background:#fff;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-family:inherit;
  font-size:14px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:#1683d8;
  color:#fff;
}

.success{
  background:#159447;
  color:#fff;
}

.danger{
  background:#d9363e;
  color:#fff;
}

.secondary{
  background:#eef1f4;
  color:#333;
}

.qr-btn{
  background:#673ab7;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:12px;
}

.ok{
  background:#e7f7ed;
  color:#146c35;
}

.err{
  background:#ffe8e8;
  color:#a40018;
}

.info{
  background:#e8f2ff;
  color:#14558a;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,
td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:right;
  white-space:nowrap;
}

th{
  background:#f7f8fa;
}

.table-wrap{
  overflow:auto;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  background:#e9f2ff;
  color:#1467a5;
}

.hidden{
  display:none !important;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.search{
  max-width:400px;
}

.qr-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.qr-box{
  background:#fff;
  width:100%;
  max-width:420px;
  border-radius:18px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

#qrcode{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:20px auto;
  min-height:256px;
}

#qrcode img,
#qrcode canvas{
  margin:auto;
}

.qr-serial{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

.qr-url{
  direction:ltr;
  word-break:break-all;
  font-size:12px;
  color:#555;
  background:#f5f5f5;
  padding:8px;
  border-radius:8px;
}

.status-line

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>استعلام نوبت</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f4f6f8;
font-family:Tahoma,Arial,sans-serif;
color:#222;
}

.container{
max-width:650px;
margin:30px auto;
padding:15px;
}

.card{
background:white;
border-radius:18px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
overflow:hidden;
}

.header{
background:#1976d2;
color:white;
padding:25px;
text-align:center;
}

.header h1{
margin:0 0 8px;
font-size:24px;
}

.header p{
margin:0;
opacity:.9;
font-size:14px;
}

.content{
padding:20px;
}

.status{
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:20px;
font-weight:bold;
background:#fff3cd;
color:#856404;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.item{
border:1px solid #e5e5e5;
border-radius:12px;
padding:14px;
background:#fafafa;
}

.label{
font-size:12px;
color:#777;
margin-bottom:7px;
}

.value{
font-size:15px;
font-weight:bold;
word-break:break-word;
}

.full{
grid-column:1/-1;
}

.loading{
text-align:center;
padding:50px 20px;
font-size:16px;
}

.error{
text-align:center;
padding:50px 20px;
color:#c62828;
}

@media(max-width:600px){

.container{
margin:10px auto;
}

.grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

}

</style>

</head>


<body>


<div class="container">

<div class="card">

<div class="header">

<h1>استعلام نوبت</h1>

<p>اطلاعات نوبت</p>

</div>


<div id="content">

<div class="loading">
در حال دریافت اطلاعات...
</div>

</div>


</div>

</div>


<script>


/* ===========================
   اطلاعات Supabase
=========================== */

const SUPABASE_URL =
"https://YOUR-PROJECT.supabase.co";

const SUPABASE_KEY =
"YOUR_ANON_KEY";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ===========================
   دریافت کد از URL
=========================== */

function getTurnCode(){

const path =
decodeURIComponent(
window.location.pathname
);

const match =
path.match(
/turn-inquiry\/([^\/]+)(?:\/Fa)?\/?$/
);

if(match){

return match[1];

}


const params =
new URLSearchParams(
window.location.search
);

return params.get("code");

}


/* ===========================
   نمایش اطلاعات
=========================== */

function item(label,value,full=false){

return `
<div class="item ${full ? "full" : ""}">

<div class="label">
${label}
</div>

<div class="value">
${value || "-"}
</div>

</div>
`;

}


/* ===========================
   بارگذاری نوبت
=========================== */

async function loadTurn(){

const code =
getTurnCode();

const content =
document.getElementById("content");


if(!code){

content.innerHTML=`
<div class="error">
کد نوبت مشخص نشده است.
</div>
`;

return;

}


const {data,error} =
await db
.from("turns")
.select("*")
.eq("code",code)
.maybeSingle();


if(error){

console.error(error);

content.innerHTML=`
<div class="error">
خطا در دریافت اطلاعات نوبت.
</div>
`;

return;

}


if(!data){

content.innerHTML=`
<div class="error">

نوبت مورد نظر پیدا نشد.

<br><br>

کد:
<strong>${code}</strong>

</div>
`;

return;

}


let statusClass="";

if(data.status==="تأیید شده"){
statusClass="background:#d1e7dd;color:#0f5132";
}

if(data.status==="لغو شده"){
statusClass="background:#f8d7da;color:#842029";
}


content.innerHTML=`

<div class="content">

<div
class="status"
style="${statusClass}"
>
وضعیت:
${data.status || "-"}
</div>


<div class="grid">


${item(
"کد نوبت",
data.code
)}


${item(
"شماره نوبت",
data.turn_number
)}


${item(
"نام راننده",
data.driver_name
)}


${item(
"پلاک خودرو",
data.vehicle_plate
)}


${item(
"نوع خودرو",
data.vehicle_type
)}


${item(
"مبدأ",
data.origin
)}


${item(
"مقصد",
data.destination
)}


${item(
"تاریخ",
data.turn_date
)}


${item(
"ساعت",
data.turn_time
)}


${item(
"توضیحات",
data.description,
true
)}

</div>

</div>

`;

}


loadTurn();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استعلام نوبت</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#087f5b,#12b886);
    color:white;
    padding:28px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:10px 0 0;
    font-size:15px;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search-box button{
    border:0;
    background:#087f5b;
    color:white;
    padding:0 22px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

.search-box button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.result{
    display:none;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px 5px;
    border-bottom:1px solid #eee;
}

.row:last-child{
    border-bottom:0;
}

.label{
    color:#666;
    font-weight:bold;
}

.value{
    color:#111;
    text-align:left;
    word-break:break-word;
}

.message{
    display:none;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    text-align:center;
    background:#fff3cd;
    color:#856404;
    line-height:1.8;
}

.debug{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#f1f3f5;
    border-radius:10px;
    font-size:12px;
    direction:ltr;
    text-align:left;
    word-break:break-all;
}

@media(max-width:500px){
    .search-box{
        flex-direction:column;
    }

    .search-box button{
        height:48px;
    }

    .row{
        flex-direction:column;
        gap:5px;
    }

    .value{
        text-align:right;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>استعلام نوبت</h1>
    <p>سامانه استعلام وضعیت نوبت خودرو</p>
</div>

<div class="container">

    <div class="card">

        <div class="search-box">

            <input
                type="text"
                id="serial"
                placeholder="شماره سریال نوبت را وارد کنید"
                autocomplete="off"
            >

            <button id="searchBtn" onclick="searchAppointment()">
                استعلام
            </button>

        </div>

        <div id="message" class="message"></div>

        <div id="debug" class="debug"></div>

        <div id="result" class="result">

            <div class="row">
                <span class="label">شماره سریال</span>
                <span class="value" id="r_serial">-</span>
            </div>

            <div class="row">
                <span class="label">مرز</span>
                <span class="value" id="r_border_name">-</span>
            </div>

            <div class="row">
                <span class="label">نوع صف</span>
                <span class="value" id="r_queue_type">-</span>
            </div>

            <div class="row">
                <span class="label">شماره پلاک</span>
                <span class="value" id="r_plate_number">-</span>
            </div>

            <div class="row">
                <span class="label">نوع نوبت</span>
                <span class="value" id="r_appointment_type">-</span>
            </div>

            <div class="row">
                <span class="label">زمان دریافت نوبت</span>
                <span class="value" id="r_received_at">-</span>
            </div>

            <div class="row">
                <span class="label">وضعیت</span>
                <span class="value" id="r_status">-</span>
            </div>

            <div class="row">
                <span class="label">ترمینال</span>
                <span class="value" id="r_terminal">-</span>
            </div>

            <div class="row">
                <span class="label">شماره خدمت</span>
                <span class="value" id="r_service_number">-</span>
            </div>

            <div class="row">
                <span class="label">ورود به ترمینال</span>
                <span class="value" id="r_entered_terminal_at">-</span>
            </div>

            <div class="row">
                <span class="label">فراخوانی</span>
                <span class="value" id="r_called_at">-</span>
            </div>

            <div class="row">
                <span class="label">خروج از ترمینال</span>
                <span class="value" id="r_exited_terminal_at">-</span>
            </div>

            <div class="row">
                <span class="label">اجازه گمرک</span>
                <span class="value" id="r_allowed_customs_at">-</span>
            </div>

        </div>

    </div>

</div>

<script>

/* =====================================================
   بررسی و ساخت اتصال Supabase
   ===================================================== */

let supabaseClient = null;

function initializeSupabase(){

    try{

        if(!window.supabase){

            showMessage(
                "کتابخانه Supabase بارگذاری نشده است.<br>" +
                "اتصال اینترنت یا CDN را بررسی کنید."
            );

            return false;
        }

        if(!window.SUPABASE_URL){

            showMessage(
                "خطا: SUPABASE_URL در config.js پیدا نشد."
            );

            return false;
        }

        if(!window.SUPABASE_ANON_KEY){

            showMessage(
                "خطا: SUPABASE_ANON_KEY در config.js پیدا نشد."
            );

            return false;
        }

        supabaseClient =
            window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_ANON_KEY
            );

        return true;

    }catch(error){

        showMessage(
            "خطا در راه‌اندازی Supabase:<br>" +
            escapeHtml(error.message || String(error))
        );

        return false;
    }
}


/* =====================================================
   پیام
   ===================================================== */

function showMessage(text){

    const box =
        document.getElementById("message");

    box.style.display = "block";

    box.innerHTML = text;
}


function hideMessage(){

    document.getElementById("message").style.display =
        "none";
}


/* =====================================================
   نمایش نتیجه
   ===================================================== */

function showResult(row){

    document.getElementById("result").style.display =
        "block";

    document.getElementById("r_serial").textContent =
        row.serial ?? "-";

    document.getElementById("r_border_name").textContent =
        row.border_name ?? "-";

    document.getElementById("r_queue_type").textContent =
        row.queue_type ?? "-";

    document.getElementById("r_plate_number").textContent =
        row.plate_number ?? "-";

    document.getElementById("r_appointment_type").textContent =
        row.appointment_type ?? "-";

    document.getElementById("r_received_at").textContent =
        row.received_at ?? "-";

    document.getElementById("r_status").textContent =
        row.status ?? "-";

    document.getElementById("r_terminal").textContent =
        row.terminal ?? "-";

    document.getElementById("r_service_number").textContent =
        row.service_number ?? "-";

    document.getElementById("r_entered_terminal_at").textContent =
        row.entered_terminal_at ?? "-";

    document.getElementById("r_called_at").textContent =
        row.called_at ?? "-";

    document.getElementById("r_exited_terminal_at").textContent =
        row.exited_terminal_at ?? "-";

    document.getElementById("r_allowed_customs_at").textContent =
        row.allowed_customs_at ?? "-";
}


/* =====================================================
   پاک کردن نتیجه
   ===================================================== */

function hideResult(){

    document.getElementById("result").style.display =
        "none";

    document.getElementById("debug").style.display =
        "none";
}


/* =====================================================
   فرار دادن متن خطا
   ===================================================== */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =====================================================
   استعلام نوبت
   ===================================================== */

async function searchAppointment(){

    hideMessage();
    hideResult();

    const button =
        document.getElementById("searchBtn");

    button.disabled = true;
    button.textContent = "در حال بررسی...";


    try{

        /* اگر اتصال آماده نیست */

        if(!supabaseClient){

            const ready =
                initializeSupabase();

            if(!ready){
                return;
            }

        }


        const url =
            new URL(window.location.href);


        const idFromUrl =
            url.searchParams.get("id");


        const serialFromUrl =
            url.searchParams.get("serial");


        const manualSerial =
            document
                .getElementById("serial")
                .value
                .trim();


        console.log(
            "QR ID:",
            idFromUrl
        );

        console.log(
            "QR Serial:",
            serialFromUrl
        );


        let row = null;


        /* =================================================
           جستجو با ID از QR
           ================================================= */

        if(
            idFromUrl !== null &&
            idFromUrl !== ""
        ){

            const numericId =
                Number(idFromUrl);


            if(
                !Number.isInteger(numericId) ||
                numericId <= 0
            ){

                showMessage(
                    "شناسه QR معتبر نیست."
                );

                return;
            }


            const result =
                await supabaseClient
                    .from("appointments")
                    .select("*")
                    .eq("id", numericId)
                    .limit(1);


            const data =
                result.data;

            const error =
                result.error;


            console.log(
                "Supabase ID result:",
                data
            );

            console.log(
                "Supabase ID error:",
                error
            );


            if(error){

                showMessage(
                    "خطا در ارتباط با پایگاه داده:<br>" +
                    escapeHtml(
                        error.message ||
                        "خطای نامشخص"
                    )
                );

                return;
            }


            if(
                !data ||
                data.length === 0
            ){

                showMessage(
                    "برای این QR کد، نوبتی با این شناسه پیدا نشد."
                );

                return;
            }


            row =
                data[0];

        }


        /* =================================================
           جستجو با سریال
           ================================================= */

        else{

            const serial =
                manualSerial ||
                serialFromUrl ||
                "";


            if(!serial){

                showMessage(
                    "لطفاً شماره سریال نوبت را وارد کنید."
                );

                return;
            }


            const result =
                await supabaseClient
                    .from("appointments")
                    .select("*")
                    .eq("serial", serial)
                    .limit(1);


            const data =
                result.data;

            const error =
                result.error;


            console.log(
                "Supabase serial result:",
                data
            );

            console.log(
                "Supabase serial error:",
                error
            );


            if(error){

                showMessage(
                    "خطا در ارتباط با پایگاه داده:<br>" +
                    escapeHtml(
                        error.message ||
                        "خطای نامشخص"
                    )
                );

                return;
            }


            if(
                !data ||
                data.length === 0
            ){

                showMessage(
                    "نوبتی با این شماره سریال پیدا نشد."
                );

                return;
            }


            row =
                data[0];

        }


        /* =================================================
           نمایش اطلاعات
           ================================================= */

        if(row){

            console.log(
                "FINAL ROW:",
                row
            );


            showResult(row);


            const debug =
                document.getElementById("debug");


            debug.style.display =
                "block";


            debug.textContent =
                "URL ID = " +
                (idFromUrl || "ندارد") +
                " | DATABASE ID = " +
                (row.id ?? "ندارد") +
                " | SERIAL = " +
                (row.serial ?? "ندارد");

        }

    }catch(error){

        console.error(
            "SEARCH ERROR:",
            error
        );


        showMessage(
            "خطا در اتصال به سرور:<br>" +
            escapeHtml(
                error.message ||
                String(error)
            ) +
            "<br><br>" +
            "اگر پیام Failed to fetch نمایش داده شد، اتصال اینترنت، Supabase یا تنظیمات پروژه را بررسی می‌کنیم."
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "استعلام";
    }

}


/* =====================================================
   اجرای اولیه
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const ready =
            initializeSupabase();


        const url =
            new URL(window.location.href);


        const id =
            url.searchParams.get("id");


        const serial =
            url.searchParams.get("serial");


        if(serial){

            document.getElementById("serial").value =
                serial;
        }


        /* QR دارای ID */

        if(
            ready &&
            id
        ){

            searchAppointment();

        }

    }
);


/* =====================================================
   کلید Enter
   ===================================================== */

document.getElementById("serial")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                searchAppointment();

            }

        }
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>استعلام نوبت</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #00695c, #00897b);
      color: white;
      padding: 28px 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.15);
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }

    .header p {
      margin: 10px 0 0;
      font-size: 15px;
      opacity: .95;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 0 15px;
    }

    .search-box {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .search-box label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      color: #444;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
      direction: ltr;
      text-align: center;
    }

    input:focus {
      border-color: #00897b;
    }

    button {
      height: 48px;
      border: none;
      border-radius: 10px;
      padding: 0 22px;
      background: #00897b;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-family: Tahoma, Arial, sans-serif;
    }

    button:hover {
      background: #00695c;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      display: none;
      font-size: 15px;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .loading {
      background: #e0f2f1;
      color: #00695c;
    }

    .result {
      display: none;
      margin-top: 22px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .result-title {
      background: #00897b;
      color: white;
      padding: 17px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
    }

    .info {
      padding: 10px 18px 18px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 14px 5px;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666;
      font-weight: bold;
      font-size: 14px;
    }

    .value {
      color: #222;
      font-size: 14px;
      text-align: left;
      direction: rtl;
      word-break: break-word;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 500px) {
      .header h1 {
        font-size: 23px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .row {
        align-items: flex-start;
      }

      .value {
        max-width: 55%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>استعلام نوبت</h1>
    <p>سامانه استعلام وضعیت نوبت خودرو</p>
  </div>

  <div class="container">

    <div class="search-box">
      <label for="serialInput">شماره سریال نوبت</label>

      <div class="input-row">
        <input
          id="serialInput"
          type="text"
          placeholder="شماره سریال را وارد کنید"
          autocomplete="off"
        >

        <button onclick="searchAppointment()">
          استعلام
        </button>
      </div>
    </div>

    <div id="loading" class="message loading">
      در حال دریافت اطلاعات...
    </div>

    <div id="error" class="message error">
      نوبت مورد نظر پیدا نشد.
    </div>

    <div id="result" class="result">

      <div class="result-title">
        اطلاعات نوبت خودرو
      </div>

      <div class="info">

        <div class="row">
          <span class="label">شماره سریال</span>
          <span class="value" id="serial"></span>
        </div>

        <div class="row">
          <span class="label">نام مرز</span>
          <span class="value" id="border_name"></span>
        </div>

        <div class="row">
          <span class="label">نوع صف</span>
          <span class="value" id="queue_type"></span>
        </div>

        <div class="row">
          <span class="label">شماره پلاک</span>
          <span class="value" id="plate_number"></span>
        </div>

        <div class="row">
          <span class="label">نوع نوبت</span>
          <span class="value" id="appointment_type"></span>
        </div>

        <div class="row">
          <span class="label">تاریخ دریافت نوبت</span>
          <span class="value" id="received_at"></span>
        </div>

        <div class="row">
          <span class="label">وضعیت</span>
          <span class="value" id="status"></span>
        </div>

        <div class="row">
          <span class="label">ترمینال</span>
          <span class="value" id="terminal"></span>
        </div>

        <div class="row">
          <span class="label">شماره سرویس</span>
          <span class="value" id="service_number"></span>
        </div>

        <div class="row">
          <span class="label">ورود به ترمینال</span>
          <span class="value" id="entered_terminal_at"></span>
        </div>

        <div class="row">
          <span class="label">فراخوانی</span>
          <span class="value" id="called_at"></span>
        </div>

        <div class="row">
          <span class="label">خروج از ترمینال</span>
          <span class="value" id="exited_terminal_at"></span>
        </div>

        <div class="row">
          <span class="label">مجاز به گمرک</span>
          <span class="value" id="allowed_customs_at"></span>
        </div>

      </div>
    </div>

  </div>

  <div class="footer">
    سامانه استعلام وضعیت نوبت خودرو
  </div>

<script>

const supabaseClient = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);


/* ================================
   پاک کردن نتایج قبلی
================================ */

function resetPage() {

  document.getElementById("loading").style.display = "none";
  document.getElementById("error").style.display = "none";
  document.getElementById("result").style.display = "none";

}


/* ================================
   نمایش خطا
================================ */

function showError(message) {

  const errorBox = document.getElementById("error");

  errorBox.textContent =
    message || "نوبت مورد نظر پیدا نشد.";

  errorBox.style.display = "block";

}


/* ================================
   نمایش بارگذاری
================================ */

function showLoading() {

  document.getElementById("loading").style.display = "block";

}


/* ================================
   مقدار خالی
================================ */

function valueOrDash(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "—";
  }

  return value;

}

   نمایش اطلاعات نوبت
================================ */

const testId = new URLSearchParams(window.location.search).get("id");

if (testId) {
  document.querySelector(".header p").textContent =
    "شناسه نوبت: " + testId;
}
</script>
